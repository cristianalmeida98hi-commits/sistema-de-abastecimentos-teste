
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#064e3b" />
        <stop offset="60%" stop-color="#031d16" />
        <stop offset="100%" stop-color="#021510" />
      </linearGradient>
      <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fef08a" />
        <stop offset="50%" stop-color="#eab308" />
        <stop offset="100%" stop-color="#ca8a04" />
      </linearGradient>
      <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#4ade80" />
        <stop offset="50%" stop-color="#16a34a" />
        <stop offset="100%" stop-color="#065f46" />
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
      </filter>
    </defs>

    <!-- Background rounded squircle / rect -->
    <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
    <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" />

    <!-- Stylized Modern Tractor & Field Symbol -->
    <g filter="url(#glow)" transform="translate(0, 10)">
      <!-- Plant / Sprout leaf on top -->
      <path d="M256 120 C230 150 210 190 235 220 C256 200 270 170 256 120 Z" fill="url(#emeraldGrad)" />
      <path d="M256 120 C282 150 302 190 277 220 C256 200 242 170 256 120 Z" fill="url(#goldGrad)" opacity="0.9" />

      <!-- Tractor Body Outline & Wheels -->
      <!-- Rear Large Wheel -->
      <circle cx="185" cy="315" r="62" fill="#011f17" stroke="url(#goldGrad)" stroke-width="14" />
      <circle cx="185" cy="315" r="32" fill="#064e3b" stroke="url(#goldGrad)" stroke-width="6" />
      <circle cx="185" cy="315" r="12" fill="url(#goldGrad)" />
      <!-- Wheel lugs -->
      <line x1="185" y1="260" x2="185" y2="280" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
      <line x1="185" y1="350" x2="185" y2="370" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
      <line x1="130" y1="315" x2="150" y2="315" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
      <line x1="220" y1="315" x2="240" y2="315" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />

      <!-- Front Small Wheel -->
      <circle cx="345" cy="335" r="42" fill="#011f17" stroke="url(#goldGrad)" stroke-width="12" />
      <circle cx="345" cy="335" r="20" fill="#064e3b" stroke="url(#goldGrad)" stroke-width="5" />
      <circle cx="345" cy="335" r="8" fill="url(#goldGrad)" />

      <!-- Tractor Cab & Hood Body -->
      <path d="M165 255 L165 195 C165 180 180 175 195 175 L255 175 L275 240 L370 245 C380 245 385 255 385 265 L385 305 L300 305 L260 255 Z" fill="url(#emeraldGrad)" />
      <!-- Cab Window -->
      <path d="M185 190 L245 190 L260 240 L185 240 Z" fill="#bbf7d0" opacity="0.85" />
      <!-- Exhaust pipe -->
      <rect x="285" y="160" width="10" height="85" rx="3" fill="url(#goldGrad)" />
      <path d="M295 160 C305 160 310 152 305 145" stroke="url(#goldGrad)" stroke-width="6" fill="none" stroke-linecap="round" />
    </g>

    <!-- Brand Name Banner inside Icon -->
    <text x="256" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#ffffff">
      ANDRADE<tspan fill="#facc15">AGRO</tspan>
    </text>
  </svg>
  